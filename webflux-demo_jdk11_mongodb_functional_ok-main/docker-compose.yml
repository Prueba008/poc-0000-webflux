version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: webflux-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - webflux-network
    restart: unless-stopped

  webflux-app:
    build: .
    container_name: webflux-demo
    ports:
      - "8080:8080"
      - "8081:8081"  # debug opcional
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MONGODB_URI=mongodb://mongo:27017/webfluxdb
      - JAVA_OPTS=-Xms256m -Xmx512m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8081
    depends_on:
      - mongo
    networks:
      - webflux-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - webflux-network
    depends_on:
      - webflux-app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - webflux-network
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  webflux-network:
    driver: bridge

volumes:
  mongo_data:
  prometheus_data:
  grafana_data:
